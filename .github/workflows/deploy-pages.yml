name: Validate and deploy browser workshop
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true   # always the newest 22.x, never an older cached build
      - run: python3 tests/check_runtime_versions.py --system-node   # CVE-2026-111497 (Node2Shell) guard
      - run: node --check app.js
      - run: node --check component-evidence.js
      - run: node --check exploded.js
      - run: node tests/validate-security-and-routes.mjs
      - run: node --check electrical.js
      - run: node --check photo-teardown.js
      - run: node tests/validate-electrical.mjs
      - run: node tests/validate-electrical-links.mjs
      - run: node tests/validate-exploded.mjs
      - run: node tests/validate-links.mjs
      - run: node tests/validate-component-evidence.mjs
      - run: node --check copilot.js
      - run: node --check source-library.js
      - run: node --check manual-library.js
      - run: node tests/validate-data.mjs
      - run: node tests/validate-sources.mjs
      - run: node tests/validate-manual-index.mjs
      - run: node --check dashboard.js
      - run: node tests/validate-teardown.mjs
      - run: node --check model.js
      - run: node tests/validate-models.mjs
      - run: node --check rider-tips.js
      - run: node tests/validate-rider-tips.mjs
      - run: node --check engine-xray.js
      - run: node tests/validate-engine-xray.mjs
      - run: node tests/validate-readme-torques.mjs
  browser-smoke:
    needs: validate
    # Playwright 1.57 Chromium supports Ubuntu 24.04; ubuntu-latest has moved to 26.04.
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install playwright==1.65.2 beautifulsoup4==4.14.2   # 1.65.2 bundles Node.js 26.13.1 (patched)
      - run: python tests/check_runtime_versions.py --playwright-node   # CVE-2026-111497 (Node2Shell) guard
      - run: python -m playwright install --with-deps chromium
      - run: python tests/browser_audit.py
      - run: python tests/security_browser_audit.py
      - run: python tests/model_browser_audit.py
      - run: python tests/engine_xray_browser_audit.py
  heritage-browser:
    needs: validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        engine: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tests/check_runtime_versions.py --system-node
      - run: npm ci && npm run build && npm test
        working-directory: heritage
      - run: python -m pip install playwright==1.65.2
      - run: python tests/check_runtime_versions.py --playwright-node
      - run: python -m playwright install --with-deps ${{ matrix.engine }}
      - run: python heritage/cross-browser.py ${{ matrix.engine }}
  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: [validate, browser-smoke, heritage-browser]
    permissions:
      contents: read
      pages: write
      id-token: write
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          check-latest: true
      - run: npm ci && npm run build && npm test
        working-directory: heritage
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: 'heritage/dist'
      - id: deployment
        uses: actions/deploy-pages@v4
